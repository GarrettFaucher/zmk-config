# Turn on mouse key
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y

# Deep sleep disabled: the charlieplex kscan has no interrupt-gpios, so ZMK's
# charlieplex driver polls and cannot arm a wake interrupt. In deep sleep only
# VBUS or reset would wake the half. Matches keyball61_right.conf.
CONFIG_ZMK_SLEEP=n

# Idle after 8 hours (8*60*60*1000ms)
CONFIG_ZMK_IDLE_TIMEOUT=28800000

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# PMW3360 Driver
CONFIG_PINCTRL=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# Deep sleep disabled: the charlieplex kscan has no interrupt-gpios, so a
# keypress cannot wake the MCU from deep sleep (see keyball61_left.conf).
CONFIG_ZMK_SLEEP=n

# Idle after 8 hours (8*60*60*1000ms)
CONFIG_ZMK_IDLE_TIMEOUT=28800000
